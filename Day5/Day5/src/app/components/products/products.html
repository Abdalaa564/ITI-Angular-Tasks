<div class="products-container">
     @for (p of products$ | async; track p.id) {
  <div class="product-card">
    <img [src]="p.images[0]!" [alt]="p.title" />

    <div class="details">
      <h3>{{ p.title }}</h3>
      <p>${{ p.price }}</p>
      <p class="rating">⭐ {{ p.rating }}</p>
      <p>{{ p.stock }} in stock</p>
    </div>

    <span class="badge out" *ngIf="p.stock === 0">Out of Stock</span>
    <span class="badge in" *ngIf="p.stock > 0">In Stock</span>

    <button class="btn btn-primary"
        [disabled]="p.stock === 0"
        (click)="addToCart(p)">
      Add to Cart
    </button>

    <button class="btn btn-secondary"
              [routerLink]="['/products', p.id]">
        View Details
      </button>

  </div>
}
</div>
